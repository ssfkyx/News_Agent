# Module: config.market
# Responsibilities: Fixed stock watchlist and market-data settings (90-day close charts).
# Dependencies: newsagent.market
# Dependents: newsagent.market, newsagent.pipeline, newsagent.standalone, ui/
# ADRs: ADR-0015, ADR-0016
# Traceability: docs/decisions/README.md
#
# 展示顺序由 newsagent.market.sort_watchlist 计算，不依赖本文件里的书写顺序：
#   1) 中国公司在前、美国公司在后（country 字段）；
#   2) 美国组内 pinned: true 的英伟达固定第一；
#   3) 其余公司按 sort_name 的字母 A-Z 排列（中国公司按拼音，英文公司按英文名）。
# group: "robot" 的股票在页面股票区中单独作为“机器人 / 具身智能”一档，排在原有 AI 公司下方。
